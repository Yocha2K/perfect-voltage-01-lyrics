<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Perfect Voltage 01（YCK-002）の歌詞カード">
  <title>Perfect Voltage 01 — 歌詞</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">YCK-002 / LYRICS</p>
      <h1>Perfect Voltage 01</h1>
      <p class="subtitle">Yocha2K feat. 宮舞モカ</p>
      <p class="intro">宮舞モカVocal中心・クラブミュージック軸の9曲。</p>
    </header>

    <section aria-labelledby="tracks-title">
      <div class="section-heading">
        <h2 id="tracks-title">TRACKLIST</h2>
        <span>9 tracks</span>
      </div>
      <nav class="track-list" aria-label="曲目一覧">
        <button class="track" data-track="01"><span>01</span><strong>We Rise</strong><small>Yocha2K feat. 宮舞モカ</small></button>
        <button class="track" data-track="02"><span>02</span><strong>My Turn!</strong></button>
        <button class="track" data-track="03"><span>03</span><strong>インキャ★パラダイス</strong></button>
        <button class="track" data-track="04"><span>04</span><strong>アラームだけセットして</strong></button>
        <button class="track" data-track="05"><span>05</span><strong>Morning Canvas</strong></button>
        <button class="track" data-track="06"><span>06</span><strong>白い残像</strong></button>
        <button class="track" data-track="07"><span>07</span><strong>怠惰プリンセス</strong></button>
        <button class="track" data-track="08"><span>08</span><strong>COME ON</strong></button>
        <button class="track" data-track="09"><span>09</span><strong>このまま、私</strong></button>
      </nav>
    </section>

    <section class="lyrics-panel" aria-live="polite" aria-labelledby="lyrics-title">
      <div class="lyrics-heading">
        <div>
          <p class="eyebrow" id="lyrics-number">SELECT A TRACK</p>
          <h2 id="lyrics-title">曲を選んでください</h2>
        </div>
        <button id="close-lyrics" class="close" type="button" hidden>閉じる</button>
      </div>
      <pre id="lyrics-content" class="lyrics-content">上の曲名をタップすると歌詞が表示されます。</pre>
    </section>

    <footer>
      <span>Perfect Voltage 01</span>
      <span>© 2026 Yocha2K</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
